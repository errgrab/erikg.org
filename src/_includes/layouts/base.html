<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta property="og:title" content="{{ title | default: 'ErikG' }}" />
    <meta property="og:description" content="Where am I? What is this? Oh, it's just art." />
    <meta property="og:image" content="https://erikg.org/banner.png" />
    <title>{{ title | default: "ErikG" }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;1,300&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/custom.css" />
    <link rel="stylesheet" href="/styles/prism-mono.css" />
    {% if script %}<script type="module" src="{{ script }}"></script>{% endif %}
    {% if style %}<link rel="stylesheet" href="{{ style }}" />{% endif %}
  </head>
  <body>
	<header class="site-header">
	  <a class="header-left" href="{{ href | default: '/site/' }}">
		<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 16 16" width="32" aria-hidden="true">
		  <g transform="scale(3) rotate(45 0 0) translate(-1.5 -1.5)" stroke-linecap="round" stroke-width="0.5" stroke-linejoin="round">
			<path d="m1 2h1v-1h1v2h-2z" fill="CanvasText" stroke="CanvasText" />
			<path d="m0 0h2v2h-2z" fill="none" stroke="CanvasText" />
		  </g>
		</svg>
		<h1>ErikG</h1>
	  </a>
	</header>
    <hr />
    <main>{{ content | raw }}</main>
	<footer class="site-footer">
      <hr />
      <div class="footer-inner">
		<span><a href="/me/" class="footer-name">ErikG</a> &bull; &nbsp;go slow and fix things</span>
		<nav>
          <a href="https://github.com/errgrab/" target="_blank" rel="noreferrer">github</a>
          <a href="mailto:eriklustosa@gmail.com">mail</a>
        </nav>
      </div>
	</footer>
  </body>
</html>
