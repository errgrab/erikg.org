<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta property="og:title" content="ErikG" />
    <meta property="og:description" content="Where am I? What is this? Oh, it's just art." />
    <meta property="og:image" content="https://erikg.org/banner.png" />

    <title>ErikG</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;1,300&display=swap" rel="stylesheet" />

    <script>
        (function () {
            try {
                var stored = localStorage.getItem("theme");
                var resolved = (stored === "black" || stored === "white")
                    ? stored
                    : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "black" : "white");
                document.documentElement.setAttribute("data-theme", resolved);
                var s = document.documentElement.style;
                if (resolved === "white") {
                    s.setProperty("--bg", "white");
                    s.setProperty("--sur", "#eeeeee");
                    s.setProperty("--fg", "black");
                    s.setProperty("--acc", "black");
                } else {
                    s.setProperty("--bg", "black");
                    s.setProperty("--sur", "#111111");
                    s.setProperty("--fg", "white");
                    s.setProperty("--acc", "white");
                }
            } catch (e) {}
        })();
    </script>

    %sveltekit.head%
</head>

<body>
    <div id="app">%sveltekit.body%</div>
</body>

</html>
